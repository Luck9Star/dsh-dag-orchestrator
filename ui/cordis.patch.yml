# dsh-dag-view bundle patch: mounts the dual-face plugin into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field in package.json); activate with
# `dsh plugin --profile <name> add link:<repo>/ui`.
#
# The row is a bare plugin by package name: the node half (exports ".")
# runs in the host process (the /dag-view/* JSON routes over the
# dagOrchestrator service face), and the dsh.client declaration in
# package.json makes the browser half (exports "./client", served at
# /plugins/dag-view/client.js) load in the web GUI.
- insert:
    - id: dag-view
      name: dsh-dag-view
